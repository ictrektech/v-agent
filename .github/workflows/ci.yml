name: VOS CI

# v-Octop ships Linux containers for VOS; upstream desktop/provider probes are archived.
on:
  push:
    branches: [main]
    paths-ignore: [ictrek.app/VERSION]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: VOS / Linux / Python 3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: make install

      - name: Lint
        run: make lint

      - name: Type check
        run: make typecheck

      - name: Test
        run: make test
